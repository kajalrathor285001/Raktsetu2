{% extends "base.html" %}{% block title %}Create account | RaktSetu{% endblock %}{% block content %}<div class="form-wrap"><div class="form-intro"><span class="eyebrow">JOIN THE NETWORK</span><h1>Create your<br><em>RaktSetu account.</em></h1><p>Choose the role that best describes how you will use the platform.</p></div><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><h2>Register</h2><label>Full name<input name="name" required></label><label>Email address<input name="email" type="email" required></label><label>Password <small>(minimum 8 characters)</small><input name="password" type="password" minlength="8" required></label><label>Account type<select name="role" required><option value="">Choose role</option><option value="donor">Blood donor</option><option value="patient">Patient / requester</option><option value="hospital">Hospital</option><option value="ngo">NGO / camp organizer</option></select></label><div class="two"><label>Blood group<select name="blood_group"><option value="">Not applicable</option>{% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option>{{ b }}</option>{% endfor %}</select></label><label>City<input name="city" placeholder="e.g. Faridabad"></label></div><label>Contact number<input name="phone" type="tel"></label><button class="btn full">Create account</button><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></div>{% endblock %}
