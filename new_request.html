{% extends "base.html" %}{% block title %}New blood request{% endblock %}{% block content %}<div class="narrow"><div class="page-title"><span class="eyebrow">REQUEST BLOOD</span><h1>Share the <em>requirement.</em></h1><p>Requests are not visible to donors until verified.</p></div><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Patient name<input name="patient_name" required></label><div class="two"><label>Blood group<select name="blood_group" required><option value="">Select</option>{% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option>{{ b }}</option>{% endfor %}</select></label><label>Units required<input name="units" type="number" min="1" max="20" value="1" required></label></div><label>City<input name="city" required></label><label>Hospital / blood bank name<input name="hospital" required></label><label>Contact number<input name="contact" required></label><label>Additional details<textarea name="details" rows="3"></textarea></label><button class="btn full">Submit request</button></form></div>{% endblock %}
